name: Go

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  # Label of the container job
  runner-job:
    runs-on: ubuntu-latest

    # Service containers to run with `runner-job`
    services:
      # S3 server for pkg/fs. SeaweedFS "mini" mode seeds the credentials and
      # bucket from these variables and serves S3 on 8333
      seaweedfs:
        image: chrislusf/seaweedfs:4.47
        ports:
          - 9000:8333
        env:
          AWS_ACCESS_KEY_ID: testaccesskey
          AWS_SECRET_ACCESS_KEY: testsecretkey
          S3_BUCKET: test
      # Label used to access the service container
      postgres:
        # Docker Hub image
        image: postgres
        # Provide the password for postgres
        env:
          POSTGRES_PASSWORD: rFcLGNkgsNtksg6Pgtn9CumL4xXBQ7
        # Set health checks to wait until postgres has started
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          # Maps tcp port 5432 on service container to the host
          - 5432:5432
    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: 1.25.5

    - name: Build
      run: make 

    - name: Test
      run: TZ=Europe/Stockholm make test
      env:
        AWS_S3_ENDPOINT: localhost:9000
        AWS_S3_ACCESSKEY: testaccesskey
        AWS_S3_SECRETKEY: testsecretkey
        AWS_S3_TLS: false
        AWS_S3_SKIPVERIFY: false
        AWS_S3_BUCKET: test
        COLONIES_DB_USER: postgres
        COLONIES_DB_PASSWORD: rFcLGNkgsNtksg6Pgtn9CumL4xXBQ7
        COLONIES_DB_HOST: localhost

    # Coverage runs the suite a second time, so it is limited to pushes to main
    # and skipped on dev pushes and pull requests to keep those runs fast
    - name: Generate coverage
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        # Get package list excluding monitoring
        PKGS=$(go list ./pkg/... | grep -v '/monitoring$' | tr '\n' ' ')
        # Run tests with coverage
        # Use -coverpkg to measure client package coverage through server tests
        go test -race -coverprofile=coverage.raw -covermode=atomic -coverpkg=./pkg/... $PKGS
        # Filter out test utilities, mocks, and monitoring from coverage report
        grep -v 'pkg/server/test_utils.go' coverage.raw | \
        grep -v 'pkg/monitoring/' | \
        grep -v '_mock.go' | \
        grep -v 'mock_test.go' > coverage.out
        rm coverage.raw
      env:
        AWS_S3_ENDPOINT: localhost:9000
        AWS_S3_ACCESSKEY: testaccesskey
        AWS_S3_SECRETKEY: testsecretkey
        AWS_S3_TLS: false
        AWS_S3_SKIPVERIFY: false
        AWS_S3_BUCKET: test
        COLONIES_DB_USER: postgres
        COLONIES_DB_PASSWORD: rFcLGNkgsNtksg6Pgtn9CumL4xXBQ7
        COLONIES_DB_HOST: localhost

    - name: Upload coverage to Codecov
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: codecov/codecov-action@v4
      with:
        files: ./coverage.out
        fail_ci_if_error: false
        verbose: true
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}